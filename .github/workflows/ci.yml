name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Build
        run: make build
