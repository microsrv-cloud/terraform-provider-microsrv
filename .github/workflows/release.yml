name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish release assets for"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oras-project/setup-oras@v1

      - name: Test
        run: make test

      - name: Package and publish to GHCR (OpenTofu OCI mirror)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          make package VERSION="$VERSION"
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GH_ACTOR" --password-stdin
          REPO="ghcr.io/$GITHUB_REPOSITORY"
          LAYOUT="$RUNNER_TEMP/provider-layout"
          suffix="terraform-provider-microsrv_${VERSION}_"
          targets=()
          for z in dist/*.zip; do
            base=$(basename "$z" .zip)
            rest="${base#"$suffix"}"
            os="${rest%_*}"
            arch="${rest#*_}"
            oras push --artifact-type application/vnd.opentofu.provider-target \
              --artifact-platform "$os/$arch" \
              --oci-layout "$LAYOUT:${os}_${arch}" \
              "$z:archive/zip"
            targets+=("${os}_${arch}")
          done
          oras manifest index create --artifact-type application/vnd.opentofu.provider \
            --oci-layout "$LAYOUT:$VERSION" "${targets[@]}"
          oras cp --from-oci-layout "$LAYOUT:$VERSION" "$REPO:$VERSION"

      # Assets required by registry.opentofu.org submission validation:
      #   terraform-provider-microsrv_<ver>_<os>_<arch>.zip
      #   terraform-provider-microsrv_<ver>_SHA256SUMS   ("<sha256>  <filename>" per line)
      #   terraform-provider-microsrv_<ver>_SHA256SUMS.sig  (optional, if GPG_PRIVATE_KEY secret is set)
      - name: Publish GitHub Release assets (OpenTofu registry format)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          case "$REF_NAME" in
            v*.*.*) ;;
            *) echo "::error::'${REF_NAME}' is not a v*.*.* tag"; exit 1 ;;
          esac
          VERSION="${REF_NAME#v}"
          BINARY="terraform-provider-microsrv"
          SUMS="${BINARY}_${VERSION}_SHA256SUMS"
          # Bare filenames (no ./ prefix) — the registry matches checksum entries by exact zip name.
          (cd dist && sha256sum *.zip > "$SUMS")
          assets=(dist/*.zip "dist/$SUMS")
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
            sign=(--batch --yes --armor --pinentry-mode loopback)
            if [ -n "${GPG_PASSPHRASE:-}" ]; then sign+=(--passphrase "$GPG_PASSPHRASE"); fi
            gpg "${sign[@]}" --detach-sign --output "dist/$SUMS.sig" "dist/$SUMS"
            assets+=("dist/$SUMS.sig")
          else
            echo "::notice::GPG_PRIVATE_KEY secret not set - publishing without SHA256SUMS.sig (register a key via a 'Provider Signing Key' issue on opentofu/registry)"
          fi
          echo "--- $SUMS ---"
          cat "dist/$SUMS"
          # draft -> attach assets -> publish: GitHub locks assets at publish time when
          # immutable releases are enabled, so uploads must happen while still a draft.
          view=$(gh release view "$REF_NAME" --json isDraft,assets 2>/dev/null || true)
          if [ -z "$view" ]; then
            gh release create "$REF_NAME" --draft --verify-tag --title "$REF_NAME" --generate-notes
            view=$(gh release view "$REF_NAME" --json isDraft,assets)
          fi
          if [ "$(jq -r '.isDraft' <<<"$view")" = "true" ]; then
            gh release upload "$REF_NAME" "${assets[@]}" --clobber
            gh release edit "$REF_NAME" --draft=false
          else
            # Published already: attach anything missing (works while mutable; explain when immutable).
            expected=$(printf '%s\n' "${assets[@]##*/}" | sort)
            have=$(jq -r '.assets[].name' <<<"$view" | sort)
            if [ -z "$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$have"))" ]; then
              echo "published release already has all assets; nothing to do"
            elif ! gh release upload "$REF_NAME" "${assets[@]}" --clobber; then
              echo "::error::published release $REF_NAME rejects asset uploads (immutable releases enabled?) — keep releases as drafts for CI, or delete release+tag and re-tag"
              exit 1
            fi
          fi

  # release:published cannot chain these workflows: events created by
  # GITHUB_TOKEN never trigger another workflow run, so the mirror is
  # invoked explicitly as a reusable workflow within this same run.
  mirror:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-mirror.yml
